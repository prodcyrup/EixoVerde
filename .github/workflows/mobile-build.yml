name: Build EixoVerde Mobile (Android APK & AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Android Gradle Requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Unit Tests
        run: |
          npm run typecheck
          npm test

      - name: Build Mobile Web Bundle & Sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPTILER_KEY: ${{ vars.VITE_MAPTILER_KEY }}
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Build Android Debug APK & Release Bundle (AAB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload Android Debug APK Artifact (Ready to Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: EixoVerde-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android Release Bundle AAB (Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: EixoVerde-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
